<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ajuda com IA — fofura</title>
  <meta name="theme-color" content="#0a0505">
  <link rel="icon" href="../images/FOFURA.png" type="image/png">

  <!-- Proteção de acesso -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script>
    (async function() {
      let key    = sessionStorage.getItem("ag:key");
      let expira = parseInt(sessionStorage.getItem("ag:expira") || "0");
      if (!key || Date.now() > expira) {
        const nome = localStorage.getItem("ag:nome");
        const hash = localStorage.getItem("ag:hash");
        if (nome && hash) {
          try { firebase.initializeApp(FIREBASE_CONFIG); } catch(e) {}
          const db      = firebase.firestore();
          const userDoc = await db.collection("usuarios").doc(nome).get();
          if (userDoc.exists) {
            const user  = userDoc.data();
            const agora = Date.now();
            if (user.senha === hash && (user.isLife || !user.expira || user.expira > agora)) {
              key    = user.key;
              expira = user.isLife ? 99999999999999 : user.expira;
              sessionStorage.setItem("ag:key",    key);
              sessionStorage.setItem("ag:expira", String(expira));
            }
          }
        }
      }
      if (!key || Date.now() > expira) {
        window.location.replace("../gate.html");
      }
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde: #04ff00;
      --preto: #0a0a0a;
      --surface: #141414;
      --border: #222;
      --texto: #fff;
      --muted: #888;
      --radius: 1rem;
    }

    body {
      min-height: 100svh;
      background: var(--preto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--texto);
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
    }
    .header a:hover { color: var(--texto); }
    .header-titulo {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge-ia {
      background: var(--verde);
      color: #000;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      letter-spacing: 0.05em;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      max-width: 42rem;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem 6rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* ── Intro ── */
    .intro {
      text-align: center;
      padding: 1.5rem 0 0.5rem;
    }
    .intro h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .intro h1 em {
      font-style: normal;
      color: var(--verde);
    }
    .intro p {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card-titulo {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    /* ── Botões de imagem ── */
    .btns-imagem {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .btn-img {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1.25rem 0.75rem;
      background: #1e1e1e;
      border: 1.5px dashed #333;
      border-radius: 0.75rem;
      color: var(--texto);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-img:hover {
      border-color: var(--verde);
      background: #1a2a1a;
    }
    .btn-img svg { opacity: 0.7; }
    .btn-img:hover svg { opacity: 1; }

    /* ── Preview da imagem ── */
    #preview-container {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }
    #preview-container.ativo { display: flex; }
    #preview-img {
      width: 100%;
      max-height: 18rem;
      object-fit: contain;
      border-radius: 0.5rem;
      background: #111;
    }
    .btn-trocar {
      background: transparent;
      border: 1px solid #333;
      border-radius: 0.5rem;
      color: var(--muted);
      font: inherit;
      font-size: 0.8rem;
      padding: 0.5rem;
      cursor: pointer;
      width: 100%;
    }
    .btn-trocar:hover { color: var(--texto); border-color: #555; }

    /* ── Câmera ── */
    #camera-container {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }
    #camera-container.ativo { display: flex; }
    #video-camera {
      width: 100%;
      border-radius: 0.5rem;
      background: #111;
      max-height: 18rem;
      object-fit: cover;
    }
    .btns-camera {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .btn-capturar {
      padding: 0.85rem;
      background: var(--verde);
      color: #000;
      border: none;
      border-radius: 0.5rem;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-capturar:hover { background: #00cc00; }
    .btn-cancelar-cam {
      padding: 0.85rem;
      background: #2a2a2a;
      color: var(--texto);
      border: none;
      border-radius: 0.5rem;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* ── Campo de texto ── */
    textarea {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 0.75rem;
      padding: 0.9rem 1rem;
      color: var(--texto);
      font: inherit;
      font-size: 0.9375rem;
      resize: none;
      min-height: 6rem;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--verde); }
    textarea::placeholder { color: #555; }

    /* ── Botão enviar ── */
    .btn-enviar {
      width: 100%;
      padding: 1rem;
      background: var(--verde);
      color: #000;
      border: none;
      border-radius: 0.75rem;
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-enviar:hover { background: #00cc00; transform: translateY(-2px); }
    .btn-enviar:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; }

    /* ── Loading ── */
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
      color: var(--muted);
    }
    .loading.ativo { display: flex; }
    .spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid #333;
      border-top-color: var(--verde);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Resposta ── */
    #resposta-container {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }
    #resposta-container.ativo { display: flex; }

    .resposta-bloco {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }
    .resposta-bloco h2 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--verde);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .resposta-texto {
      font-size: 0.9375rem;
      line-height: 1.75;
      color: #ddd;
      white-space: pre-wrap;
    }
    .resposta-texto strong { color: var(--verde); font-weight: 700; }
    .resposta-texto code {
      background: #1e1e1e;
      border-radius: 0.3rem;
      padding: 0.1rem 0.4rem;
      font-family: monospace;
      font-size: 0.875rem;
      color: #04ff00;
    }

    .bloco-resposta-final {
      background: #0a1a0a;
      border: 1.5px solid var(--verde);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: center;
    }
    .bloco-resposta-final h2 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--verde);
      margin-bottom: 0.75rem;
    }
    .resposta-final-texto {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--verde);
      line-height: 1.6;
    }

    .btn-nova-pergunta {
      width: 100%;
      padding: 0.9rem;
      background: #1e1e1e;
      color: var(--texto);
      border: 1px solid #333;
      border-radius: 0.75rem;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-nova-pergunta:hover { background: #2a2a2a; }

    /* ── Input file oculto ── */
    #input-galeria { display: none; }
    canvas#canvas-camera { display: none; }
  </style>
</head>
<body>

<header class="header">
  <a href="../index.html">← Voltar</a>
  <div class="header-titulo">
    Ajuda com <span class="badge-ia">IA</span>
  </div>
</header>

<main class="main">

  <div class="intro">
    <h1>Ajuda com <em>IA</em></h1>
    <p>Tire uma foto da sua questão, lição ou exercício e eu vou te ajudar a entender e resolver.</p>
  </div>

  <!-- Seleção de imagem -->
  <div class="card" id="card-imagem">
    <span class="card-titulo">📷 Escolha uma imagem</span>

    <div class="btns-imagem" id="btns-selecao">
      <button class="btn-img" id="btn-camera">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Tirar Foto
      </button>
      <button class="btn-img" id="btn-galeria">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Da Galeria
      </button>
    </div>

    <!-- Câmera -->
    <div id="camera-container">
      <video id="video-camera" autoplay playsinline muted></video>
      <div class="btns-camera">
        <button class="btn-capturar" id="btn-capturar">📸 Capturar</button>
        <button class="btn-cancelar-cam" id="btn-cancelar-cam">Cancelar</button>
      </div>
    </div>

    <!-- Preview -->
    <div id="preview-container">
      <img id="preview-img" src="" alt="Imagem selecionada">
      <button class="btn-trocar" id="btn-trocar">🔄 Trocar imagem</button>
    </div>

    <input type="file" id="input-galeria" accept="image/*" capture="environment">
    <canvas id="canvas-camera"></canvas>
  </div>

  <!-- Pergunta -->
  <div class="card">
    <span class="card-titulo">💬 O que você precisa?</span>
    <textarea id="campo-pergunta" placeholder="Ex: Resolva essa questão para mim. / Não entendi essa conta. / Me explique o conteúdo." rows="4"></textarea>
  </div>

  <!-- Botão enviar -->
  <button class="btn-enviar" id="btn-enviar" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
    ENVIAR PARA IA
  </button>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>A IA está analisando sua questão...</span>
  </div>

  <!-- Resposta -->
  <div id="resposta-container">
    <div class="resposta-bloco" id="bloco-explicacao">
      <h2>📚 Entendendo a questão</h2>
      <div class="resposta-texto" id="texto-explicacao"></div>
    </div>
    <div class="resposta-bloco" id="bloco-resolucao">
      <h2>🔢 Como resolver</h2>
      <div class="resposta-texto" id="texto-resolucao"></div>
    </div>
    <div class="bloco-resposta-final" id="bloco-final">
      <h2>✅ Resposta final</h2>
      <div class="resposta-final-texto" id="texto-final"></div>
    </div>
    <button class="btn-nova-pergunta" id="btn-nova">🔄 Nova pergunta</button>
  </div>

</main>

<script>
const WORKER_URL = "https://fofura-ia.wagnercartel1.workers.dev";

let imagemBase64 = null;
let streamCamera = null;

const btnCamera      = document.getElementById("btn-camera");
const btnGaleria     = document.getElementById("btn-galeria");
const inputGaleria   = document.getElementById("input-galeria");
const cameraContainer= document.getElementById("camera-container");
const btnsSelecao    = document.getElementById("btns-selecao");
const videoCamera    = document.getElementById("video-camera");
const canvasCamera   = document.getElementById("canvas-camera");
const btnCapturar    = document.getElementById("btn-capturar");
const btnCancelarCam = document.getElementById("btn-cancelar-cam");
const previewContainer=document.getElementById("preview-container");
const previewImg     = document.getElementById("preview-img");
const btnTrocar      = document.getElementById("btn-trocar");
const campoPergunta  = document.getElementById("campo-pergunta");
const btnEnviar      = document.getElementById("btn-enviar");
const loading        = document.getElementById("loading");
const respostaContainer = document.getElementById("resposta-container");
const btnNova        = document.getElementById("btn-nova");

// ── Câmera ──
btnCamera.addEventListener("click", async () => {
  try {
    streamCamera = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }
    });
    videoCamera.srcObject = streamCamera;
    btnsSelecao.style.display = "none";
    cameraContainer.classList.add("ativo");
  } catch(e) {
    alert("Não foi possível acessar a câmera. Use 'Da Galeria' para escolher uma foto.");
  }
});

btnCapturar.addEventListener("click", () => {
  canvasCamera.width  = videoCamera.videoWidth;
  canvasCamera.height = videoCamera.videoHeight;
  canvasCamera.getContext("2d").drawImage(videoCamera, 0, 0);
  const dataUrl = canvasCamera.toDataURL("image/jpeg", 0.85);
  imagemBase64 = dataUrl.split(",")[1];
  previewImg.src = dataUrl;
  pararCamera();
  mostrarPreview();
});

btnCancelarCam.addEventListener("click", () => {
  pararCamera();
  btnsSelecao.style.display = "grid";
  cameraContainer.classList.remove("ativo");
});

function pararCamera() {
  if (streamCamera) {
    streamCamera.getTracks().forEach(t => t.stop());
    streamCamera = null;
  }
  cameraContainer.classList.remove("ativo");
}

// ── Galeria ──
btnGaleria.addEventListener("click", () => inputGaleria.click());

inputGaleria.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;
    // Converte para JPEG base64
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const max = 1200;
      let w = img.width, h = img.height;
      if (w > max) { h = h * max / w; w = max; }
      if (h > max) { w = w * max / h; h = max; }
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      const jpeg = canvas.toDataURL("image/jpeg", 0.85);
      imagemBase64 = jpeg.split(",")[1];
      previewImg.src = jpeg;
      mostrarPreview();
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(file);
  inputGaleria.value = "";
});

function mostrarPreview() {
  btnsSelecao.style.display = "none";
  previewContainer.classList.add("ativo");
  atualizaBtnEnviar();
}

btnTrocar.addEventListener("click", () => {
  imagemBase64 = null;
  previewImg.src = "";
  previewContainer.classList.remove("ativo");
  btnsSelecao.style.display = "grid";
  atualizaBtnEnviar();
});

// ── Habilita botão enviar ──
campoPergunta.addEventListener("input", atualizaBtnEnviar);

function atualizaBtnEnviar() {
  btnEnviar.disabled = !(imagemBase64 && campoPergunta.value.trim());
}

// ── Enviar para IA ──
btnEnviar.addEventListener("click", async () => {
  const mensagem = campoPergunta.value.trim();
  if (!imagemBase64 || !mensagem) return;

  // Esconde tudo e mostra loading
  document.getElementById("card-imagem").style.display = "none";
  document.querySelector(".card:nth-of-type(2)").style.display = "none";
  btnEnviar.style.display = "none";
  respostaContainer.classList.remove("ativo");
  loading.classList.add("ativo");

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ imagem: imagemBase64, mensagem })
    });

    const data = await res.json();
    loading.classList.remove("ativo");

    if (data.error) {
      alert("Erro da IA: " + data.error);
      resetarUI();
      return;
    }

    exibeResposta(data.resposta);

  } catch(e) {
    loading.classList.remove("ativo");
    alert("Erro ao conectar com a IA. Verifique sua conexão.");
    resetarUI();
  }
});

function exibeResposta(texto) {
  // Separa as seções pelo padrão ## 
  const secoes = {
    explicacao: "",
    resolucao:  "",
    final:      ""
  };

  const linhas = texto.split("\n");
  let secaoAtual = "explicacao";

  for (const linha of linhas) {
    const l = linha.trim();
    if (l.match(/##\s*(Entendendo|entendendo)/i)) { secaoAtual = "explicacao"; continue; }
    if (l.match(/##\s*(Como\s+resolver|como\s+resolver|Passo|passo)/i)) { secaoAtual = "resolucao"; continue; }
    if (l.match(/##\s*(Resposta\s+final|resposta\s+final|Resultado)/i)) { secaoAtual = "final"; continue; }
    secoes[secaoAtual] += linha + "\n";
  }

  // Se não separou por seção, coloca tudo na explicação
  if (!secoes.resolucao && !secoes.final) {
    secoes.explicacao = texto;
  }

  document.getElementById("texto-explicacao").innerHTML = formatarTexto(secoes.explicacao.trim());
  document.getElementById("texto-resolucao").innerHTML  = formatarTexto(secoes.resolucao.trim());
  document.getElementById("texto-final").innerHTML      = formatarTexto(secoes.final.trim());

  // Esconde blocos vazios
  if (!secoes.resolucao.trim()) document.getElementById("bloco-resolucao").style.display = "none";
  if (!secoes.final.trim())     document.getElementById("bloco-final").style.display = "none";

  respostaContainer.classList.add("ativo");
}

function formatarTexto(texto) {
  return texto
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/\n/g, "<br>");
}

// ── Nova pergunta ──
btnNova.addEventListener("click", resetarUI);

function resetarUI() {
  imagemBase64 = null;
  previewImg.src = "";
  campoPergunta.value = "";
  previewContainer.classList.remove("ativo");
  btnsSelecao.style.display = "grid";
  respostaContainer.classList.remove("ativo");
  loading.classList.remove("ativo");
  document.getElementById("card-imagem").style.display = "";
  document.querySelector(".card:nth-of-type(2)").style.display = "";
  btnEnviar.style.display = "";
  btnEnviar.disabled = true;
  document.getElementById("bloco-resolucao").style.display = "";
  document.getElementById("bloco-final").style.display = "";
}
</script>

</body>
</html>
