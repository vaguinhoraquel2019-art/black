<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fofura — Acesso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #04ff00;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #000;
      padding: 1rem;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 46rem;
      align-items: stretch;
    }
    @media (min-width: 640px) {
      .wrapper {
        flex-direction: row;
        align-items: flex-start;
      }
    }
    .card {
      width: 100%;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 1rem;
      padding: 2rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    /* ── cartão de preços ── */
    .card-precos {
      width: 100%;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 1rem;
      padding: 2rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card-precos h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .card-precos h2 span {
      color: #04ff00;
      -webkit-text-stroke: 1px #000;
    }
    .lista-precos {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .item-preco {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0.9rem;
      border-radius: 0.5rem;
      background: rgba(0,0,0,0.05);
      border: 1px solid rgba(0,0,0,0.09);
    }
    .item-preco.destaque {
      background: rgba(4,255,0,0.12);
      border-color: rgba(4,255,0,0.4);
    }
    .preco-plano {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      min-width: 4.5rem;
    }
    .preco-sep {
      flex: 1;
      height: 1px;
      background: rgba(0,0,0,0.12);
    }
    .preco-valor {
      font-size: 0.875rem;
      font-weight: 700;
      color: #000;
    }
    .btn-pague {
      display: block;
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem;
      background: #000;
      color: #04ff00;
      border: none;
      border-radius: 0.5rem;
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-pague:hover {
      background: #222;
      transform: translateY(-2px);
    }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      background: rgba(0,0,0,0.07);
      border-radius: 0.5rem;
      padding: 0.25rem;
    }
    .tab {
      padding: 0.6rem;
      border: none;
      border-radius: 0.35rem;
      background: transparent;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      color: #555;
      transition: background 0.2s, color 0.2s;
    }
    .tab.ativo {
      background: #fff;
      color: #000;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }
    input {
      width: 100%;
      background: rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 0.5rem;
      padding: 0.85rem 1rem;
      color: #000;
      font: inherit;
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: rgba(0,0,0,0.35); }
    input::placeholder { color: #999; }
    button.btn-principal {
      width: 100%;
      padding: 0.9rem;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-principal:hover { background: #222; }
    button.btn-principal:disabled { background: #aaa; cursor: not-allowed; }
    .erro { font-size: 0.8rem; color: #c00; text-align: center; display: none; }
    .erro.ativo { display: block; }
    .form { display: flex; flex-direction: column; gap: 0.75rem; }
    .hidden { display: none; }

    /* ── painel de mensagem do admin ── */
    #painel-msg {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #painel-msg.ativo { display: flex; }
    .msg-card {
      background: #fff;
      border-radius: 1rem;
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 24rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: center;
    }
    .msg-titulo { font-size: 1.1rem; font-weight: 800; }
    .msg-texto  { font-size: 0.9rem; color: #333; line-height: 1.6; }
    .msg-key    { font-family: monospace; font-size: 1rem; font-weight: 700;
                  background: #f0fdf4; border: 1px solid #86efac;
                  border-radius: 0.5rem; padding: 0.75rem 1rem; color: #16a34a;
                  word-break: break-all; }
    .msg-btns   { display: flex; gap: 0.75rem; }
    .msg-btn    { flex: 1; padding: 0.75rem; border: none; border-radius: 0.5rem;
                  font: inherit; font-size: 0.875rem; font-weight: 700; cursor: pointer; }
    .msg-btn.verde { background: #16a34a; color: #fff; }
    .msg-btn.verde:hover { background: #15803d; }
    .msg-btn.cinza { background: #e5e7eb; color: #374151; }
    .msg-btn.cinza:hover { background: #d1d5db; }

    /* tela sem key */
    #tela-sem-key {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 998;
      background: #04ff00;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #tela-sem-key.ativo { display: flex; }
    .sem-key-card {
      background: #fff;
      border-radius: 1rem;
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 24rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: center;
    }
    .sem-key-titulo { font-size: 1.1rem; font-weight: 800; }
    .sem-key-texto  { font-size: 0.875rem; color: #555; line-height: 1.6; }
    .sem-key-nome   { font-size: 0.8rem; color: #999; }
    .btn-pague-key  {
      display: block; width: 100%; padding: 0.9rem;
      background: #000; color: #04ff00; border: none;
      border-radius: 0.5rem; font: inherit; font-size: 0.9375rem;
      font-weight: 800; letter-spacing: 0.06em; cursor: pointer;
      text-decoration: none; text-align: center;
    }
    .btn-pague-key:hover { background: #222; }
    .sem-key-ou { color: #aaa; font-size: 0.8rem; }
    .btn-ja-tenho-key {
      background: transparent; border: 1px solid #ddd;
      border-radius: 0.5rem; padding: 0.7rem; font: inherit;
      font-size: 0.875rem; color: #555; cursor: pointer; width: 100%;
    }
    .btn-ja-tenho-key:hover { background: #f5f5f5; }
    .input-key-manual {
      width: 100%; background: #f5f5f5; border: 1px solid #ddd;
      border-radius: 0.5rem; padding: 0.75rem 1rem; font: inherit;
      font-size: 0.875rem; outline: none; text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input-key-manual:focus { border-color: #000; }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- Cartão de preços das keys -->
  <div class="card-precos">
    <h2>Preços das <span>Keys</span></h2>
    <ul class="lista-precos">
      <li class="item-preco">
        <span class="preco-plano">1 dia</span>
        <span class="preco-sep"></span>
        <span class="preco-valor">R$ 3</span>
      </li>
      <li class="item-preco">
        <span class="preco-plano">3 dias</span>
        <span class="preco-sep"></span>
        <span class="preco-valor">R$ 5</span>
      </li>
      <li class="item-preco">
        <span class="preco-plano">5 dias</span>
        <span class="preco-sep"></span>
        <span class="preco-valor">R$ 7</span>
      </li>
      <li class="item-preco">
        <span class="preco-plano">7 dias</span>
        <span class="preco-sep"></span>
        <span class="preco-valor">R$ 10</span>
      </li>
      <li class="item-preco">
        <span class="preco-plano">15 dias</span>
        <span class="preco-sep"></span>
        <span class="preco-valor">R$ 15</span>
      </li>
      <li class="item-preco destaque">
        <span class="preco-plano">30 dias</span>
        <span class="preco-sep"></span>
        <span class="preco-valor">R$ 23</span>
      </li>
    </ul>
    <a class="btn-pague" href="https://vaguinhoraquel2019-art.github.io/black/pix/" target="_blank" rel="noopener noreferrer">PAGUE AQUI</a>
  </div>

  <!-- Cartão de login -->
  <div class="card">
  <h1>fofura</h1>

  <div class="tabs">
    <button class="tab ativo" id="tab-entrar" onclick="mostraAba('entrar')">Entrar</button>
    <button class="tab" id="tab-registrar" onclick="mostraAba('registrar')">Registrar</button>
  </div>

  <!-- Entrar -->
  <div class="form" id="form-entrar">
    <input type="text" id="e-nome" placeholder="Nome" autocomplete="off" spellcheck="false">
    <input type="password" id="e-senha" placeholder="Senha">
    <button class="btn-principal" id="btn-entrar">Entrar</button>
  </div>

  <!-- Registrar -->
  <div class="form hidden" id="form-registrar">
    <input type="text" id="r-nome" placeholder="Nome" autocomplete="off" spellcheck="false">
    <input type="password" id="r-senha" placeholder="Senha">
    <button class="btn-principal" id="btn-registrar">Registrar</button>
  </div>

  <p class="erro" id="erro"></p>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>

<!-- Tela sem key -->
<div id="tela-sem-key">
  <div class="sem-key-card">
    <div class="sem-key-titulo">🔑 Você precisa de uma Key</div>
    <div class="sem-key-nome" id="sem-key-usuario"></div>
    <div class="sem-key-texto">
      Para acessar o site, você precisa de uma key.<br>
      Escolha um plano, faça o pix e aguarde a liberação.
    </div>
    <a class="btn-pague-key" href="pix/" target="_blank">PAGUE AQUI</a>
    <div class="sem-key-ou">— ou se já tem uma key —</div>
    <button class="btn-ja-tenho-key" id="btn-mostrar-key">Já tenho uma Key</button>
    <div id="form-key-manual" style="display:none;flex-direction:column;gap:0.5rem;">
      <input class="input-key-manual" type="text" id="input-key-manual" placeholder="XXXX-XXXX-XXXX">
      <button class="btn-principal" id="btn-ativar-key">Ativar Key</button>
    </div>
    <p id="erro-key" style="font-size:0.8rem;color:#c00;display:none;"></p>
  </div>
</div>

<!-- Painel de mensagens do admin -->
<div id="painel-msg">
  <div class="msg-card" id="msg-card-conteudo"></div>
</div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

function mostraAba(aba) {
  document.getElementById("form-entrar").classList.toggle("hidden", aba !== "entrar");
  document.getElementById("form-registrar").classList.toggle("hidden", aba !== "registrar");
  document.getElementById("tab-entrar").classList.toggle("ativo", aba === "entrar");
  document.getElementById("tab-registrar").classList.toggle("ativo", aba === "registrar");
  document.getElementById("erro").classList.remove("ativo");
}

function mostraErro(msg) {
  const e = document.getElementById("erro");
  e.textContent = msg;
  e.classList.add("ativo");
}

function hashSenha(senha) {
  // hash simples via btoa para não guardar senha em texto puro
  return btoa(unescape(encodeURIComponent(senha)));
}

/* ── REGISTRAR ── */
document.getElementById("btn-registrar").addEventListener("click", async () => {
  const nome  = document.getElementById("r-nome").value.trim();
  const senha = document.getElementById("r-senha").value;
  const btn   = document.getElementById("btn-registrar");

  if (!nome || !senha) { mostraErro("Preencha todos os campos."); return; }

  btn.textContent = "Criando conta...";
  btn.disabled = true;

  try {
    // Verifica se nome já existe
    const nomeDoc = await db.collection("usuarios").doc(nome.toLowerCase()).get();
    if (nomeDoc.exists) { mostraErro("Esse nome já está em uso."); return; }

    // Cria o usuário SEM key — key será entregue pelo admin
    await db.collection("usuarios").doc(nome.toLowerCase()).set({
      nome,
      senha: hashSenha(senha),
      key:    null,
      expira: null,
      isLife: false,
      criado: Date.now()
    });

    // Salva só na sessão atual (some quando fechar o browser)
    sessionStorage.setItem("ag:nome", nome.toLowerCase());
    sessionStorage.setItem("ag:hash", hashSenha(senha));

    // Mostra tela de espera (sem redirecionar)
    mostraTelaSemKey(nome.toLowerCase());

  } catch(e) {
    mostraErro("Erro: " + e.message);
  }

  btn.textContent = "Registrar";
  btn.disabled = false;
});

/* ── ENTRAR ── */
document.getElementById("btn-entrar").addEventListener("click", async () => {
  const nome  = document.getElementById("e-nome").value.trim().toLowerCase();
  const senha = document.getElementById("e-senha").value;
  const btn   = document.getElementById("btn-entrar");

  if (!nome || !senha) { mostraErro("Preencha todos os campos."); return; }

  btn.textContent = "Verificando...";
  btn.disabled = true;

  try {
    const userDoc = await db.collection("usuarios").doc(nome).get();
    if (!userDoc.exists) { mostraErro("Nome ou senha incorretos."); return; }

    const user  = userDoc.data();
    if (user.senha !== hashSenha(senha)) { mostraErro("Nome ou senha incorretos."); return; }

    const agora = Date.now();

    // Salva só na sessão atual (some quando fechar o browser)
    sessionStorage.setItem("ag:nome", nome);
    sessionStorage.setItem("ag:hash", hashSenha(senha));

    // Se não tem key ainda → tela de espera
    if (!user.key) {
      mostraTelaSemKey(nome);
      return;
    }

    // Verifica expiração
    if (!user.isLife && user.expira !== null && user.expira < agora) {
      mostraErro("Seu acesso expirou.");
      return;
    }

    // Salva sessão completa
    sessionStorage.setItem("ag:key", user.key);
    sessionStorage.setItem("ag:expira", user.isLife ? "99999999999999" : String(user.expira));

    // Verifica mensagens antes de redirecionar
    await verificaMensagens(nome);
    iniciaListenerMensagens(nome);
    if (!document.getElementById("painel-msg").classList.contains("ativo")) {
      window.location.href = "index.html";
    }

  } catch(e) {
    mostraErro("Erro: " + e.message);
  }

  btn.textContent = "Entrar";
  btn.disabled = false;
});

/* Enter nos campos */
["e-senha", "r-senha"].forEach(id => {
  document.getElementById(id)?.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const isReg = !document.getElementById("form-registrar").classList.contains("hidden");
      isReg ? document.getElementById("btn-registrar").click()
            : document.getElementById("btn-entrar").click();
    }
  });
});

/* Sem login automático — sempre pede usuario e senha ao abrir */

/* ── Tela de espera sem key ── */
function mostraTelaSemKey(nome) {
  document.getElementById("sem-key-usuario").textContent = "Conta: " + nome;
  document.getElementById("tela-sem-key").classList.add("ativo");
  // Inicia listener para receber key do admin em tempo real
  iniciaListenerMensagens(nome);
}

document.getElementById("btn-mostrar-key").addEventListener("click", () => {
  const form = document.getElementById("form-key-manual");
  const visivel = form.style.display === "flex";
  form.style.display = visivel ? "none" : "flex";
});

document.getElementById("btn-ativar-key").addEventListener("click", async () => {
  const key  = document.getElementById("input-key-manual").value.trim().toUpperCase();
  const erro = document.getElementById("erro-key");
  const btn  = document.getElementById("btn-ativar-key");
  const nome = sessionStorage.getItem("ag:nome");

  if (!key) { erro.textContent = "Digite a key."; erro.style.display = "block"; return; }

  btn.textContent = "Verificando...";
  btn.disabled = true;
  erro.style.display = "none";

  try {
    const keyDoc = await db.collection("keys").doc(key).get();
    if (!keyDoc.exists) { erro.textContent = "Key inválida."; erro.style.display = "block"; return; }

    const dados  = keyDoc.data();
    const agora  = Date.now();
    const isLife = dados.dias === 0 || dados.expira === null;

    if (dados.usada) { erro.textContent = "Essa key já foi usada."; erro.style.display = "block"; return; }

    const expira = isLife ? null : agora + dados.dias * 24 * 60 * 60 * 1000;

    await db.collection("keys").doc(key).update({ usada: true, expira, primeiroUso: agora });
    await db.collection("usuarios").doc(nome).update({ key, expira, isLife });

    sessionStorage.setItem("ag:key",    key);
    sessionStorage.setItem("ag:expira", isLife ? "99999999999999" : String(expira));

    document.getElementById("tela-sem-key").classList.remove("ativo");
    window.location.href = "index.html";

  } catch(e) {
    erro.textContent = "Erro: " + e.message;
    erro.style.display = "block";
  }

  btn.textContent = "Ativar Key";
  btn.disabled = false;
});

/* ── Verificar mensagens pendentes do admin ── */
async function verificaMensagens(nome) {
  const snap = await db.collection("mensagens_cliente")
    .where("para", "==", nome.toLowerCase())
    .where("lida", "==", false)
    .get();

  if (snap.empty) return;

  // Pega a mais recente
  const docs = snap.docs.sort((a,b) => b.data().data - a.data().data);
  const doc  = docs[0];
  const msg  = doc.data();

  if (msg.tipo === "key") {
    mostraMsgKey(doc.id, msg.keyCode, msg.dias);
  } else if (msg.tipo === "valor_insuficiente") {
    mostraMsgInsuficiente(doc.id, msg.falta, msg.dias);
  }
}

/* ── Listener em tempo real para mensagens novas ── */
let unsubscribeMsg = null;
function iniciaListenerMensagens(nome) {
  if (unsubscribeMsg) return;
  unsubscribeMsg = db.collection("mensagens_cliente")
    .where("para", "==", nome.toLowerCase())
    .where("lida", "==", false)
    .onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        if (change.type === "added") {
          const doc = change.doc;
          const msg = doc.data();
          if (msg.tipo === "key") {
            mostraMsgKey(doc.id, msg.keyCode, msg.dias);
          } else if (msg.tipo === "valor_insuficiente") {
            mostraMsgInsuficiente(doc.id, msg.falta, msg.dias);
          }
        }
      });
    });
}

function mostraMsgKey(docId, keyCode, dias) {
  const painel = document.getElementById("painel-msg");
  const card   = document.getElementById("msg-card-conteudo");
  const nome   = sessionStorage.getItem("ag:nome");

  // Ativa a key automaticamente na conta
  (async () => {
    try {
      const agora  = Date.now();
      const isLife = dias === 0;
      const expira = isLife ? null : agora + dias * 24 * 60 * 60 * 1000;
      await db.collection("keys").doc(keyCode).update({ usada: true, expira, primeiroUso: agora }).catch(()=>{});
      await db.collection("usuarios").doc(nome).update({ key: keyCode, expira, isLife });
      sessionStorage.setItem("ag:key",    keyCode);
      sessionStorage.setItem("ag:expira", isLife ? "99999999999999" : String(expira));
    } catch(e) {}
  })();

  card.innerHTML = `
    <div class="msg-titulo">🔑 SUA KEY FOI LIBERADA!</div>
    <div class="msg-texto">Sua Key de <strong>${dias} dia${dias > 1 ? "s" : ""}</strong>:</div>
    <div class="msg-key">${keyCode}</div>
    <div class="msg-texto" style="font-size:0.75rem;color:#888">Sua conta já foi ativada automaticamente!</div>
    <button class="msg-btn verde" id="btn-entrar-site">🚀 Entrar no site</button>
  `;
  // Fecha tela de espera se estiver aberta
  document.getElementById("tela-sem-key").classList.remove("ativo");
  painel.classList.add("ativo");

  document.getElementById("btn-entrar-site").addEventListener("click", async () => {
    await db.collection("mensagens_cliente").doc(docId).update({ lida: true });
    painel.classList.remove("ativo");
    window.location.href = "index.html";
  });
}

function mostraMsgInsuficiente(docId, falta, dias) {
  const painel = document.getElementById("painel-msg");
  const card   = document.getElementById("msg-card-conteudo");
  card.innerHTML = `
    <div class="msg-titulo">⚠️ Valor insuficiente</div>
    <div class="msg-texto">
      Você enviou um valor menor que o necessário.<br><br>
      Falta <strong>R$ ${parseFloat(falta).toFixed(2)}</strong> para completar a Key de
      <strong>${dias} dia${dias > 1 ? "s" : ""}</strong>.
    </div>
    <div class="msg-btns">
      <button class="msg-btn cinza" id="btn-reembolso">💰 REEMBOLSO</button>
      <button class="msg-btn verde" id="btn-pagar-resto">💳 PAGAR</button>
    </div>
  `;
  painel.classList.add("ativo");

  document.getElementById("btn-reembolso").addEventListener("click", async () => {
    const nome = sessionStorage.getItem("ag:nome") || "desconhecido";
    await db.collection("solicitacoes_reembolso").add({
      usuario: nome,
      falta:   parseFloat(falta),
      dias:    dias,
      data:    Date.now()
    });
    await db.collection("mensagens_cliente").doc(docId).update({ lida: true });
    card.innerHTML = `
      <div class="msg-titulo">✅ Reembolso solicitado</div>
      <div class="msg-texto">Seu pedido foi registrado.<br>Aguarde até 24 horas.</div>
      <button class="msg-btn cinza" id="btn-fechar-remb">Fechar</button>
    `;
    document.getElementById("btn-fechar-remb").addEventListener("click", () => {
      painel.classList.remove("ativo");
    });
  });

  document.getElementById("btn-pagar-resto").addEventListener("click", async () => {
    await db.collection("mensagens_cliente").doc(docId).update({ lida: true });
    painel.classList.remove("ativo");
    window.open("pix/", "_blank");
  });
}
</script>

</body>
</html>
