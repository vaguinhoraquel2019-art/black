<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — fofura</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      background: #04ff00;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #000;
      padding: 1.5rem 1rem 3rem;
    }
    .topo {
      max-width: 36rem;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 { font-size: 1.1rem; font-weight: 700; }
    .wrap { max-width: 36rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    h2 { font-size: 0.9375rem; font-weight: 600; color: #fff; }
    .grid-dias {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
    }
    .btn-dia {
      padding: 0.75rem 0;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 0.5rem;
      color: #fff;
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-dia:hover { background: #2a2a2a; border-color: #555; }
    .btn-dia.ativo { background: #fff; color: #000; border-color: #fff; }
    .key-gerada {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 0.5rem;
      padding: 0.85rem 1rem;
      font-family: "Courier New", monospace;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
      color: #0f0;
      word-break: break-all;
      display: none;
    }
    .key-gerada.ativo { display: block; }
    .btn-gerar {
      padding: 0.9rem;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 0.5rem;
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-gerar:hover { background: #ddd; }
    .btn-copiar {
      padding: 0.75rem;
      background: transparent;
      color: #ccc;
      border: 1px solid #2a2a2a;
      border-radius: 0.5rem;
      font: inherit;
      font-size: 0.875rem;
      cursor: pointer;
      display: none;
      transition: color 0.2s;
    }
    .btn-copiar.ativo { display: block; }
    .btn-copiar:hover { color: #fff; }

    /* lista de keys */
    .key-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid #1e1e1e;
      font-size: 0.8125rem;
    }
    .key-item:last-child { border-bottom: 0; }
    .key-codigo { font-family: monospace; color: #ccc; word-break: break-all; }
    .key-expira { color: #aaa; white-space: nowrap; font-size: 0.75rem; }
    .btn-deletar {
      background: none;
      border: none;
      color: #e55;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.25rem;
      flex-shrink: 0;
    }
    .vazio { color: #666; font-size: 0.875rem; text-align: center; padding: 1rem 0; }

    /* vendas */
    .input-venda {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 0.5rem;
      padding: 0.85rem 1rem;
      color: #fff;
      font: inherit;
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-venda:focus { border-color: #555; }
    .input-venda::placeholder { color: #666; }
    .venda-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid #1e1e1e;
      font-size: 0.8125rem;
    }
    .venda-item:last-child { border-bottom: 0; }
    .venda-info { display: flex; flex-direction: column; gap: 0.2rem; }
    .venda-nome { color: #fff; font-weight: 600; }
    .venda-pix  { color: #aaa; font-size: 0.75rem; font-family: monospace; }
    .venda-valor { color: #0f0; font-weight: 700; white-space: nowrap; }
    #tela-login {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #tela-admin { display: none; }
    .card-login {
      background: #141414;
      border: 1px solid #222;
      border-radius: 1rem;
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 20rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    input {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 0.5rem;
      padding: 0.85rem 1rem;
      color: #fff;
      font: inherit;
      outline: none;
    }
    input::placeholder { color: #666; }
    input:focus { border-color: #555; }
    .erro-login { font-size: 0.8rem; color: #e55; display: none; }
    .erro-login.ativo { display: block; }
    .btn-sair {
      background: none;
      border: 1px solid #2a2a2a;
      border-radius: 0.5rem;
      color: #aaa;
      font: inherit;
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
    }
    .btn-sair:hover { color: #fff; }

    /* links apostilas */
    .link-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid #1e1e1e;
      font-size: 0.8125rem;
    }
    .link-item:last-child { border-bottom: 0; }
    .link-nome { color: #ccc; font-size: 0.75rem; margin-bottom: 0.3rem; }
    .link-url  { color: #04ff00; font-family: monospace; font-size: 0.7rem; word-break: break-all; }
    .link-vazio { color: #555; font-size: 0.7rem; font-style: italic; }
    .input-link {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 0.4rem;
      padding: 0.55rem 0.75rem;
      color: #fff;
      font: inherit;
      font-size: 0.8125rem;
      outline: none;
    }
    .input-link:focus { border-color: #555; }
    .input-link::placeholder { color: #555; }
    .btn-salvar-link {
      background: #04ff00;
      color: #000;
      border: none;
      border-radius: 0.4rem;
      padding: 0.55rem 0.9rem;
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-salvar-link:hover { background: #00cc00; }
    .btn-salvar-link:disabled { background: #555; color: #999; cursor: not-allowed; }
    .filtro-apostila {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 0.5rem;
      padding: 0.65rem 0.75rem;
      color: #fff;
      font: inherit;
      font-size: 0.875rem;
      outline: none;
    }
    .filtro-apostila:focus { border-color: #555; }
    .filtro-apostila::placeholder { color: #555; }

    /* logs pix */
    .log-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 0.5rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid #1e1e1e;
      font-size: 0.8125rem;
    }
    .log-item:last-child { border-bottom: 0; }
    .log-info { display: flex; flex-direction: column; gap: 0.2rem; }
    .log-nick { color: #fff; font-weight: 600; }
    .log-contato { color: #04ff00; font-size: 0.75rem; font-family: monospace; }
    .log-data { color: #555; font-size: 0.7rem; }
    .log-valor { color: #04ff00; font-weight: 700; white-space: nowrap; }
    .btn-entregar-key {
      background: #04ff00; color: #000; border: none; border-radius: 0.4rem;
      padding: 0.4rem 0.75rem; font: inherit; font-size: 0.75rem; font-weight: 800;
      cursor: pointer; white-space: nowrap;
    }
    .btn-entregar-key:hover { background: #00cc00; }
    .btn-entregar-key:disabled { background: #555; color: #999; cursor: not-allowed; }
    .btn-enviar-msg {
      background: #f59e0b; color: #000; border: none; border-radius: 0.4rem;
      padding: 0.4rem 0.75rem; font: inherit; font-size: 0.75rem; font-weight: 800;
      cursor: pointer; white-space: nowrap;
    }
    .btn-enviar-msg:hover { background: #d97706; }
    .btn-enviar-msg:disabled { background: #555; color: #999; cursor: not-allowed; }
    .log-key-info { color: #04ff00; font-size: 0.7rem; font-family: monospace; margin-top: 0.2rem; }

    /* usuários */
    .user-card {
      border: 1px solid #2a2a2a;
      border-radius: 0.6rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: #1a1a1a;
    }
    .user-nome { color: #fff; font-weight: 700; font-size: 0.9rem; }
    .user-campo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.78rem;
    }
    .user-label { color: #666; min-width: 5rem; }
    .user-valor { color: #ccc; font-family: monospace; word-break: break-all; }
    .user-valor.verde { color: #04ff00; }
    .user-valor.vermelho { color: #e55; }
    .input-nova-senha {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 0.4rem;
      padding: 0.4rem 0.6rem;
      color: #fff;
      font: inherit;
      font-size: 0.78rem;
      outline: none;
    }
    .input-nova-senha:focus { border-color: #555; }
    .btn-trocar-senha {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 0.4rem;
      color: #fff;
      font: inherit;
      font-size: 0.75rem;
      padding: 0.4rem 0.7rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-trocar-senha:hover { background: #3a3a3a; }
    .btn-deletar-user {
      background: none;
      border: none;
      color: #e55;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.3rem 0.5rem;
      align-self: flex-end;
    }

    /* ── banner de alerta pix ── */
    #banner-alerta {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      background: #16a34a;
      color: #fff;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      animation: pisca 0.6s infinite alternate;
    }
    #banner-alerta.ativo { display: flex; }
    @keyframes pisca {
      from { background: #16a34a; }
      to   { background: #15803d; box-shadow: 0 0 30px #04ff00; }
    }
    .btn-parar {
      background: #fff;
      color: #16a34a;
      border: none;
      border-radius: 0.4rem;
      padding: 0.45rem 1.1rem;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-parar:hover { background: #d1fae5; }
  </style>
</head>
<body>

<!-- ALERTA PIX -->
<div id="banner-alerta">
  <span id="banner-texto">💰 Novo pagamento recebido!</span>
  <button class="btn-parar" id="btn-parar-alerta">Parar</button>
</div>

<!-- LOGIN -->
<div id="tela-login">
  <div class="card-login">
    <h1 style="font-size:1.1rem;font-weight:700">Painel Admin</h1>
    <input type="password" id="senha" placeholder="Senha" autocomplete="off">
    <button class="btn-gerar" id="btn-login">Entrar</button>
    <p class="erro-login" id="erro-login">Senha incorreta.</p>
  </div>
</div>

<!-- ADMIN -->
<div id="tela-admin">
  <div class="topo">
    <h1>Painel Admin — fofura</h1>
    <button class="btn-sair" id="btn-sair">Sair</button>
  </div>

  <div class="wrap">
    <!-- Gerar key -->
    <div class="card">
      <h2>Gerar nova key</h2>
      <div class="grid-dias">
        <button class="btn-dia ativo" data-dias="1">1 dia</button>
        <button class="btn-dia" data-dias="3">3 dias</button>
        <button class="btn-dia" data-dias="5">5 dias</button>
        <button class="btn-dia" data-dias="7">7 dias</button>
        <button class="btn-dia" data-dias="15">15 dias</button>
        <button class="btn-dia" data-dias="0" style="grid-column:span 5;background:#1a1a1a;border-color:#000">♾ Lifetime</button>
      </div>
      <button class="btn-gerar" id="btn-gerar">Gerar key</button>
      <div class="key-gerada" id="key-gerada"></div>
      <button class="btn-copiar" id="btn-copiar">Copiar key</button>
    </div>

    <!-- Lista de keys -->
    <div class="card">
      <h2>Keys ativas</h2>
      <div id="lista-keys"><p class="vazio">Carregando...</p></div>
    </div>

    <!-- Registrar venda -->
    <div class="card">
      <h2>Registrar venda</h2>
      <input class="input-venda" type="text" id="venda-nome" placeholder="Nome do cliente" autocomplete="off">
      <input class="input-venda" type="text" id="venda-key" placeholder="Key vendida" autocomplete="off">
      <input class="input-venda" type="number" id="venda-valor" placeholder="Valor (R$)" min="0" step="0.01">
      <button class="btn-gerar" id="btn-registrar-venda">Registrar venda</button>
    </div>

    <!-- Histórico de vendas -->
    <div class="card">
      <h2>Histórico de vendas</h2>
      <div id="lista-vendas"><p class="vazio">Carregando...</p></div>
    </div>

    <!-- Keys usadas -->
    <div class="card">
      <h2>Keys usadas</h2>
      <div id="lista-keys-usadas"><p class="vazio">Carregando...</p></div>
    </div>

    <!-- Logs Pix -->
    <div class="card">
      <h2>Logs Pix</h2>
      <div id="lista-logs-pix"><p class="vazio">Carregando...</p></div>
    </div>

    <!-- Usuários -->
    <div class="card">
      <h2>Usuários</h2>
      <div id="lista-usuarios"><p class="vazio">Carregando...</p></div>
    </div>

    <!-- Reembolsos -->
    <div class="card">
      <h2>Solicitações de Reembolso</h2>
      <div id="lista-reembolsos"><p class="vazio">Carregando...</p></div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

let diasSelecionado = 1;

/* ── Login ── */
document.getElementById("btn-login").addEventListener("click", () => {
  const senha = document.getElementById("senha").value;
  if (senha === ADMIN_PASSWORD) {
    document.getElementById("tela-login").style.display = "none";
    document.getElementById("tela-admin").style.display = "block";
    carregaKeys();
    carregaVendas();
    carregaKeysUsadas();
    carregaLogsPix();
    iniciaListenerPix();
    carregaLinksApostilas();
    carregaUsuarios();
    carregaReembolsos();
  } else {
    document.getElementById("erro-login").classList.add("ativo");
  }
});
document.getElementById("senha").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("btn-login").click();
});
document.getElementById("btn-sair").addEventListener("click", () => {
  document.getElementById("tela-login").style.display = "flex";
  document.getElementById("tela-admin").style.display = "none";
});

/* ── Seleção de dias ── */
for (const btn of document.querySelectorAll(".btn-dia")) {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".btn-dia").forEach(b => b.classList.remove("ativo"));
    btn.classList.add("ativo");
    diasSelecionado = parseInt(btn.dataset.dias);
  });
}

/* ── Gerar key ── */
function geraCodigoKey(dias) {
  const prefixos = { 0: "LIFETIME", 1: "DIARIA", 3: "TRIO", 5: "CINCO", 7: "SEMANA", 15: "QUINZENA" };
  const prefixo  = prefixos[dias] || "KEY";
  const rand     = Array.from(crypto.getRandomValues(new Uint8Array(12)))
    .map(b => b.toString(16).padStart(2, "0")).join("").toUpperCase();
  return prefixo + "-" + rand;
}

document.getElementById("btn-gerar").addEventListener("click", async () => {
  const btn  = document.getElementById("btn-gerar");
  btn.textContent = "Gerando...";
  btn.disabled = true;

  const key    = geraCodigoKey(diasSelecionado);
  const expira = diasSelecionado === 0 ? null : Date.now() + diasSelecionado * 24 * 60 * 60 * 1000;

  try {
    await db.collection("keys").doc(key).set({ expira, dias: diasSelecionado, criada: Date.now(), usada: false });
    const campo  = document.getElementById("key-gerada");
    const copiar = document.getElementById("btn-copiar");
    campo.textContent = key;
    campo.classList.add("ativo");
    copiar.classList.add("ativo");
    carregaKeys();
  } catch(e) {
    alert("Erro: " + e.message);
  }

  btn.textContent = "Gerar key";
  btn.disabled = false;
});

document.getElementById("btn-copiar").addEventListener("click", async () => {
  const key = document.getElementById("key-gerada").textContent;
  await navigator.clipboard.writeText(key);
  document.getElementById("btn-copiar").textContent = "Copiado!";
  setTimeout(() => document.getElementById("btn-copiar").textContent = "Copiar key", 2000);
});

/* ── Lista keys ── */
async function carregaKeys() {
  const lista = document.getElementById("lista-keys");
  lista.innerHTML = "<p class='vazio'>Carregando...</p>";

  const snap = await db.collection("keys").orderBy("criada", "desc").get();

  // Apenas keys que ainda NÃO foram usadas
  const naoUsadas = snap.docs.filter(d => !d.data().usada);

  if (naoUsadas.length === 0) {
    lista.innerHTML = "<p class='vazio'>Nenhuma key disponível.</p>";
    return;
  }

  lista.innerHTML = "";
  for (const doc of naoUsadas) {
    const d      = doc.data();
    const isLife = d.dias === 0 || d.expira === null;
    const status = isLife ? "♾ Lifetime" : `${d.dias} dia${d.dias > 1 ? "s" : ""}`;

    const item = document.createElement("div");
    item.className = "key-item";
    item.innerHTML = `
      <span class="key-codigo" style="color:#ccc">${doc.id}</span>
      <span class="key-expira" style="color:${isLife ? '#0af' : '#666'}">${status}</span>
      <button class="btn-deletar" data-key="${doc.id}" title="Deletar">✕</button>
    `;
    lista.append(item);
  }

  for (const btn of lista.querySelectorAll(".btn-deletar")) {
    btn.addEventListener("click", async () => {
      await db.collection("keys").doc(btn.dataset.key).delete();
      carregaKeys();
      carregaKeysUsadas();
    });
  }
}
/* ── Vendas ── */
document.getElementById("btn-registrar-venda").addEventListener("click", async () => {
  const nome  = document.getElementById("venda-nome").value.trim();
  const key   = document.getElementById("venda-key").value.trim();
  const valor = parseFloat(document.getElementById("venda-valor").value);
  const btn   = document.getElementById("btn-registrar-venda");

  if (!nome || !key || !valor || valor <= 0) {
    alert("Preencha todos os campos.");
    return;
  }

  btn.textContent = "Registrando...";
  btn.disabled = true;

  try {
    await db.collection("vendas").add({ nome, key, valor, data: Date.now() });
    document.getElementById("venda-nome").value  = "";
    document.getElementById("venda-key").value   = "";
    document.getElementById("venda-valor").value = "";
    carregaVendas();
  } catch(e) {
    alert("Erro: " + e.message);
  }

  btn.textContent = "Registrar venda";
  btn.disabled = false;
});

async function carregaVendas() {
  const lista = document.getElementById("lista-vendas");
  lista.innerHTML = "<p class='vazio'>Carregando...</p>";

  const snap = await db.collection("vendas").orderBy("data", "desc").get();

  if (snap.empty) {
    lista.innerHTML = "<p class='vazio'>Nenhuma venda registrada.</p>";
    return;
  }

  let totalGeral = 0;
  lista.innerHTML = "";

  for (const doc of snap.docs) {
    const d    = doc.data();
    const data = new Date(d.data).toLocaleDateString("pt-BR");
    totalGeral += d.valor;

    const item = document.createElement("div");
    item.className = "venda-item";
    item.innerHTML = `
      <div class="venda-info">
        <span class="venda-nome">${d.nome}</span>
        <span class="venda-pix">${d.key || d.pix || ""}</span>
        <span style="color:#555;font-size:0.7rem">${data}</span>
      </div>
      <span class="venda-valor">R$ ${d.valor.toFixed(2)}</span>
      <button class="btn-deletar" data-id="${doc.id}" title="Deletar">✕</button>
    `;
    lista.append(item);
  }

  // Total
  const total = document.createElement("div");
  total.style.cssText = "padding-top:0.75rem;border-top:1px solid #2a2a2a;display:flex;justify-content:space-between;font-size:0.875rem;font-weight:700;";
  total.innerHTML = `<span style="color:#000">Total</span><span style="color:#0f0">R$ ${totalGeral.toFixed(2)}</span>`;
  lista.append(total);

  for (const btn of lista.querySelectorAll(".btn-deletar")) {

/* ══════════════════════════════════════════
   TABELA DE PREÇOS DAS KEYS
   ══════════════════════════════════════════ */
const TABELA_KEYS = [
  { dias: 1,  valor: 3  },
  { dias: 3,  valor: 5  },
  { dias: 5,  valor: 7  },
  { dias: 7,  valor: 10 },
  { dias: 15, valor: 15 },
  { dias: 30, valor: 23 },
];

function keyParaValor(valor) {
  // Retorna a key exata se o valor bater, ou null
  return TABELA_KEYS.find(k => k.valor <= valor) 
    ? TABELA_KEYS.slice().reverse().find(k => k.valor <= valor)
    : null;
}

function proxKey(valor) {
  // Retorna a key mais próxima acima do valor pago
  return TABELA_KEYS.find(k => k.valor > valor) || null;
}

async function carregaLogsPix() {
  const lista = document.getElementById("lista-logs-pix");
  lista.innerHTML = "<p class='vazio'>Carregando...</p>";

  try {
    const snap = await db.collection("logs_pix").orderBy("data", "desc").get();

    if (snap.empty) {
      lista.innerHTML = "<p class='vazio'>Nenhum log ainda.</p>";
      return;
    }

    let totalGeral = 0;
    lista.innerHTML = "";

    for (const doc of snap.docs) {
      const d      = doc.data();
      const data   = new Date(d.data).toLocaleString("pt-BR");
      const valor  = d.valor || 0;
      totalGeral  += valor;

      // Determina qual key o valor cobre
      const keyExata = keyParaValor(valor);
      const keyProx  = proxKey(valor);
      const falta    = keyProx ? (keyProx.valor - valor).toFixed(2) : null;
      const jaEntregue = d.keyEntregue || false;

      const item = document.createElement("div");
      item.className = "log-item";
      item.innerHTML = `
        <div class="log-info">
          <span class="log-nick">${d.nick || "—"}</span>
          <span class="log-contato">${d.contato || "sem contato"}</span>
          <span class="log-data">${data}</span>
          ${jaEntregue ? '<span class="log-key-info">✅ Key entregue</span>' : ""}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.4rem">
          <span class="log-valor">R$ ${valor.toFixed(2)}</span>
          ${!jaEntregue && keyExata
            ? `<button class="btn-entregar-key" data-id="${doc.id}" data-nick="${d.nick||''}" data-dias="${keyExata.dias}">🔑 ENTREGAR KEY</button>`
            : ""
          }
          ${!jaEntregue && !keyExata && keyProx
            ? `<button class="btn-enviar-msg" data-id="${doc.id}" data-nick="${d.nick||''}" data-contato="${d.contato||''}" data-falta="${falta}" data-dias="${keyProx.dias}">💬 ENVIAR MENSAGEM</button>`
            : ""
          }
          <button class="btn-deletar" data-id="${doc.id}" title="Deletar">✕</button>
        </div>
      `;
      lista.append(item);
    }

    const total = document.createElement("div");
    total.style.cssText = "padding-top:0.75rem;border-top:1px solid #2a2a2a;display:flex;justify-content:space-between;font-size:0.875rem;font-weight:700;";
    total.innerHTML = `<span style="color:#aaa">Total gerado</span><span style="color:#04ff00">R$ ${totalGeral.toFixed(2)}</span>`;
    lista.append(total);

    // ── ENTREGAR KEY ──
    for (const btn of lista.querySelectorAll(".btn-entregar-key")) {
      btn.addEventListener("click", async () => {
        const id   = btn.dataset.id;
        const nick = btn.dataset.nick;
        const dias = parseInt(btn.dataset.dias);

        // Busca uma key disponível com os dias certos
        const keysSnap = await db.collection("keys")
          .where("usada", "==", false)
          .where("dias", "==", dias)
          .limit(1).get();

        if (keysSnap.empty) {
          alert(`Não há keys de ${dias} dia(s) disponíveis. Gere uma primeiro.`);
          return;
        }

        const keyDoc = keysSnap.docs[0];
        const keyCode = keyDoc.id;

        btn.textContent = "Enviando...";
        btn.disabled = true;

        try {
          // Salva mensagem para o cliente no Firestore
          await db.collection("mensagens_cliente").add({
            para:    nick.toLowerCase(),
            tipo:    "key",
            keyCode: keyCode,
            dias:    dias,
            data:    Date.now(),
            lida:    false
          });

          // Marca log como entregue
          await db.collection("logs_pix").doc(id).update({ keyEntregue: true, keyCode });

          btn.textContent = "✅ Entregue!";
          setTimeout(() => carregaLogsPix(), 1500);
        } catch(e) {
          alert("Erro: " + e.message);
          btn.textContent = "🔑 ENTREGAR KEY";
          btn.disabled = false;
        }
      });
    }

    // ── ENVIAR MENSAGEM (valor insuficiente) ──
    for (const btn of lista.querySelectorAll(".btn-enviar-msg")) {
      btn.addEventListener("click", async () => {
        const nick    = btn.dataset.nick;
        const contato = btn.dataset.contato;
        const falta   = btn.dataset.falta;
        const dias    = btn.dataset.dias;

        btn.textContent = "Enviando...";
        btn.disabled = true;

        try {
          await db.collection("mensagens_cliente").add({
            para:    nick.toLowerCase(),
            tipo:    "valor_insuficiente",
            falta:   parseFloat(falta),
            dias:    parseInt(dias),
            contato: contato,
            data:    Date.now(),
            lida:    false
          });

          btn.textContent = "✅ Enviada!";
          setTimeout(() => { btn.textContent = "💬 ENVIAR MENSAGEM"; btn.disabled = false; }, 2000);
        } catch(e) {
          alert("Erro: " + e.message);
          btn.textContent = "💬 ENVIAR MENSAGEM";
          btn.disabled = false;
        }
      });
    }

    // ── DELETAR ──
    for (const btn of lista.querySelectorAll(".btn-deletar")) {
      btn.addEventListener("click", async () => {
        await db.collection("logs_pix").doc(btn.dataset.id).delete();
        carregaLogsPix();
      });
    }

  } catch(e) {
    lista.innerHTML = `<p class='vazio'>Erro: ${e.message}</p>`;
  }
}

let linksCache = {}; // cache dos links já carregados do Firestore

async function carregaLinksApostilas() {
  const lista = document.getElementById("lista-links-apostilas");
  lista.innerHTML = "<p class='vazio'>Carregando...</p>";
  try {
    const snap = await db.collection("links_apostilas").get();
    snap.forEach(doc => { linksCache[doc.id] = doc.data().url || ""; });
    renderizaLinks(APOSTILAS_ADMIN);
  } catch(e) {
    lista.innerHTML = `<p class='vazio'>Erro: ${e.message}</p>`;
  }
}

function renderizaLinks(apostilas) {
  const lista = document.getElementById("lista-links-apostilas");
  if (!apostilas.length) {
    lista.innerHTML = "<p class='vazio'>Nenhuma apostila encontrada.</p>";
    return;
  }
  lista.innerHTML = "";
  for (const a of apostilas) {
    const urlAtual = linksCache[String(a.id)] || "";
    const item = document.createElement("div");
    item.className = "link-item";
    item.dataset.id = a.id;
    item.innerHTML = `
      <div>
        <div class="link-nome">#${a.id} — ${a.nome}</div>
        <input class="input-link" type="url" placeholder="Cole o link aqui..." value="${urlAtual}" data-link-id="${a.id}">
      </div>
      <button class="btn-salvar-link" data-save-id="${a.id}">Salvar</button>
    `;
    lista.append(item);
  }

  // Eventos de salvar
  for (const btn of lista.querySelectorAll(".btn-salvar-link")) {
    btn.addEventListener("click", async () => {
      const id  = btn.dataset.saveId;
      const inp = lista.querySelector(`input[data-link-id="${id}"]`);
      const url = inp.value.trim();
      btn.textContent = "...";
      btn.disabled = true;
      try {
        await db.collection("links_apostilas").doc(id).set({ url });
        linksCache[id] = url;
        btn.textContent = "✓";
        setTimeout(() => { btn.textContent = "Salvar"; btn.disabled = false; }, 1500);
      } catch(e) {
        btn.textContent = "Erro";
        btn.disabled = false;
      }
    });
  }
}

function filtrarLinks(q) {
  const termo = q.toLowerCase().trim();
  const filtrado = termo
    ? APOSTILAS_ADMIN.filter(a => a.nome.toLowerCase().includes(termo))
    : APOSTILAS_ADMIN;
  renderizaLinks(filtrado);
}

        </div>

          <span class="user-label">Key</span>
          <span class="user-valor" style="font-size:0.65rem">${keyInfo}</span>
        </div>

          <span class="user-label">Dias da key</span>
          <span class="user-valor verde">${diasInfo}</span>
        </div>

          <span class="user-label">Expira</span>
          <span class="user-valor ${expirou ? "vermelho" : "verde"}">${expiraTexto}</span>

        <button class="btn-deletar-user" data-user="${nome}">🗑 Deletar usuário</button>
      `;
      lista.append(card);
    }

    // Eventos trocar senha
    for (const btn of lista.querySelectorAll(".btn-trocar-senha")) {
      btn.addEventListener("click", async () => {
        const user = btn.dataset.user;
        const inp  = lista.querySelector(`.input-nova-senha[data-user="${user}"]`);
        const nova = inp.value.trim();
        if (!nova) return;
        btn.textContent = "...";
        btn.disabled = true;
        try {
          const hash = btoa(unescape(encodeURIComponent(nova)));
          await db.collection("usuarios").doc(user).update({ senha: hash });
          btn.textContent = "✓";
          inp.value = "";
          setTimeout(() => { btn.textContent = "Salvar"; btn.disabled = false; }, 1500);
        } catch(e) {
          btn.textContent = "Erro";
          btn.disabled = false;
        }
      });
    }

    // Eventos deletar usuário
    for (const btn of lista.querySelectorAll(".btn-deletar-user")) {
      btn.addEventListener("click", async () => {
        const user = btn.dataset.user;
        if (!confirm(`Deletar o usuário "${user}"?`)) return;
        await db.collection("usuarios").doc(user).delete();
        carregaUsuarios();
      });
    }

  } catch(e) {
    lista.innerHTML = `<p class='vazio'>Erro: ${e.message}</p>`;
  }
}

/* ══════════════════════════════════════════
   ALERTA SONORO — novo log pix em tempo real
   ══════════════════════════════════════════ */

let audioCtx      = null;
let bipeInterval  = null;
let alertaAtivo   = false;
let unsubscribePix = null;

function bipe() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value = 880;
  osc.type = "sine";
  gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.4);
}

function iniciaAlerta(nick, valor) {
  if (alertaAtivo) return;
  alertaAtivo = true;
  const banner = document.getElementById("banner-alerta");
  document.getElementById("banner-texto").textContent =
    `💰 Novo pagamento de ${nick} — R$ ${valor.toFixed(2)}`;
  banner.classList.add("ativo");
  bipe();
  bipeInterval = setInterval(bipe, 1200);
}

function paraAlerta() {
  alertaAtivo = false;
  clearInterval(bipeInterval);
  bipeInterval = null;
  document.getElementById("banner-alerta").classList.remove("ativo");
}

document.getElementById("btn-parar-alerta").addEventListener("click", paraAlerta);

function iniciaListenerPix() {
  if (unsubscribePix) return; // já ouvindo

  // Marca o timestamp atual para ignorar logs antigos
  const agora = Date.now();

  unsubscribePix = db.collection("logs_pix")
    .orderBy("data", "desc")
    .limit(1)
    .onSnapshot(snap => {
      snap.docChanges().forEach(change => {
        if (change.type === "added") {
          const d = change.doc.data();
          // Só alerta se o log foi criado DEPOIS de abrir o admin
          if (d.data && d.data > agora) {
            iniciaAlerta(d.nick || "alguém", d.valor || 0);
            carregaLogsPix(); // atualiza a lista automaticamente
          }
        }
      });
    });
}

</script>
